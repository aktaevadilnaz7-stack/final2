<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artists | BlackPink Spotify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">BP-SPOTIFY</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="artists.html" style="color: #ff4d8d;">Artists</a></li>
                <li><a href="albums.html">Albums</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><button id="openLogin" class="login-btn">Login</button></li>
            </ul>
        </nav>
    </header>

    <main class="container py-5">
        <h1 class="text-center mb-5" style="color: var(--spotify-pink);">Top 10 Artists</h1>
        <div class="grid-container">
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-30-36.jpg" alt="Tyla">
                <h3>TYLA</h3>
            </div>
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-30-51.jpg" alt="Face">
                <h3>FACE</h3>
            </div>
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-30-55.jpg" alt="Sabrina">
                <h3>Sabrina Carpenter</h3>
            </div>
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-31-01.jpg" alt="Justin">
                <h3>Justin Bieber</h3>
            </div>
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-31-05.jpg" alt="Lady Gaga">
                <h3>Lady GAGA</h3>
            </div>
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-31-09.jpg" alt="Jennie">
                <h3>JENNIE</h3>
            </div>
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-31-13.jpg" alt="Bruno Mars">
                <h3>Bruno Mars</h3>
            </div>
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-31-16.jpg" alt="Strykalo">
                <h3>Valentin Strykalo</h3>
            </div>
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-31-21.jpg" alt="Maksim">
                <h3>MAKSIM</h3>
            </div>
            <div class="artist-card">
                <img src="img/photo_2026-04-15_21-31-29.jpg" alt="Selena">
                <h3>Selena Gomez</h3>
            </div>
        </div>
    </main>

    <div id="loginModal" class="custom-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 class="text-pink">Login</h2>
            <input type="text" id="loginUser" placeholder="Username">
            <input type="password" id="loginPass" placeholder="Password">
            <input type="password" id="loginPassConfirm" placeholder="Confirm Password">
            <small class="error-text" id="passMatchError" style="display:none; margin-bottom: 10px;">Passwords do not match</small>
            <button id="signInBtn" class="btn-pink-full">Sign In</button>
        </div>
    </div>
    
    <footer><p>© 2026 Dilnaz DJ-2503 | Final Project</p></footer>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
