<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albums | BlackPink Spotify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">BP-SPOTIFY</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="artists.html">Artists</a></li>
                <li><a href="albums.html" style="color: #ff4d8d;">Albums</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><button id="openLogin" class="login-btn">Login</button></li>
            </ul>
        </nav>
    </header>

    <main class="container py-5">
        <h2 class="text-center mb-4 text-pink">Album Management System</h2>
        
        <div class="row mb-4 align-items-center justify-content-between g-3">
            <div class="col-12 col-md-6">
                <input type="text" id="tableSearch" class="form-control m-0" placeholder="Search by artist, album or genre...">
            </div>
            <div class="col-12 col-md-4 text-md-end">
                <button id="openAddModalBtn" class="btn-pink-full" style="max-width: 200px;">+ Add New Album</button>
            </div>
        </div>

        <div class="table-container">
            <table class="comparison-table" id="crudTable">
                <thead>
                    <tr>
                        <th style="cursor: pointer;" id="sortByArtist">Artist <span class="sort-icon">↕</span></th>
                        <th style="cursor: pointer;" id="sortByAlbum">Best Album <span class="sort-icon">↕</span></th>
                        <th style="cursor: pointer;" id="sortByYear">Release Year <span class="sort-icon">↕</span></th>
                        <th style="cursor: pointer;" id="sortByGenre">Genre <span class="sort-icon">↕</span></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </main>

    <div id="crudModal" class="custom-modal">
        <div class="modal-content">
            <span class="close-crud-modal" style="position: absolute; top: 10px; right: 15px; font-size: 25px; cursor: pointer;">&times;</span>
            <h2 class="text-pink" id="modalTitle">Add New Album</h2>
            <form id="crudForm">
                <input type="hidden" id="entryIndex">
                
                <div style="text-align: left; margin-bottom: 10px;">
                    <label style="font-size: 12px; color: #aaa;">Artist Name</label>
                    <input type="text" id="modalArtist" placeholder="e.g. Lady Gaga">
                </div>
                
                <div style="text-align: left; margin-bottom: 10px;">
                    <label style="font-size: 12px; color: #aaa;">Album Title</label>
                    <input type="text" id="modalAlbum" placeholder="e.g. The Fame Monster">
                </div>
                
                <div style="text-align: left; margin-bottom: 10px;">
                    <label style="font-size: 12px; color: #aaa;">Release Year</label>
                    <input type="number" id="modalYear" placeholder="e.g. 2009">
                </div>
                
                <div style="text-align: left; margin-bottom: 15px;">
                    <label style="font-size: 12px; color: #aaa;">Genre</label>
                    <input type="text" id="modalGenre" placeholder="e.g. Pop/Electronic">
                </div>
                
                <button type="submit" id="saveEntryBtn" class="btn-pink-full">Save Changes</button>
            </form>
        </div>
    </div>

    <div id="loginModal" class="custom-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 class="text-pink">Login</h2>
            <input type="text" id="loginUser" placeholder="Username">
            <input type="password" id="loginPass" placeholder="Password">
            <input type="password" id="loginPassConfirm" placeholder="Confirm Password">
            <small class="error-text" id="passMatchError" style="display:none; margin-bottom: 10px;">Passwords do not match</small>
            <button id="signInBtn" class="btn-pink-full">Sign In</button>
        </div>
    </div>
    
    <footer><p>© 2026 Dilnaz DJ-2503 | Final Project</p></footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
